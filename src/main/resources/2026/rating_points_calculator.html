<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../../../styles.css">
	<script src="../../../../nav.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор очков рейтинга</title>
    <style>
        #rating-form {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
            max-width: 960px;
            margin-bottom: 28px;
        }

        .form-group {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: none;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px;
            box-shadow: var(--shadow);
        }

        .form-group.gender-group {
            grid-column: 1 / -1;
            max-width: 220px;
        }

        .form-group.result-group {
            grid-column: 1 / -1;
            background: none;
            border: none;
            box-shadow: none;
            padding: 0;
            display: block;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            flex: 1;
            font-size: 0.88em;
            color: var(--muted);
        }

        input,
        select,
        output {
            padding: 6px 8px;
        }

        input {
            flex: 0 0 80px;
            max-width: 80px;
            text-align: right;
        }

        .calc-total {
            margin-top: 14px;
            padding: 14px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            font-size: 1.15em;
            font-weight: 700;
        }

        .calc-total span {
            color: var(--accent-1);
        }

        .formula-details {
            max-width: 600px;
            margin-bottom: 20px;
        }

        .formula-details summary {
            display: inline-block;
            padding: 7px 16px;
            border-radius: 999px;
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            color: var(--accent-1);
            font-weight: 600;
            font-size: 0.92em;
            cursor: pointer;
            list-style: none;
        }

        .formula-details summary::-webkit-details-marker {
            display: none;
        }

        .formula-details summary:hover {
            background: var(--gradient);
            color: #fff;
            border-color: transparent;
        }

        .formula-details img {
            display: block;
            margin-top: 12px;
            max-width: 100%;
            height: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
    </style>
</head>

<body>
    <a href="index.html">← Все старты</a>
    <h1>Калькулятор очков рейтинга</h1>
    <p style="max-width: 600px; width: 100%;">Калькулятор позволяет рассчитать очки в рейтинге, основываясь на
        результатах каждого старта
        согласно пункта 14.7
        <a href="https://triatlon.by/assets/images/files/federation/polozhenie-lyubitelskaya-liga-2026-podpisano.pdf"
            target="_blank" rel="noopener noreferrer">Положения</a>
        о Любительской Лиге.
    </p>
    <details class="formula-details">
        <summary>Показать текст пункта 14.7</summary>
        <img src="img/rating_points_formula.png" alt="Пункт 14.7 Положения">
    </details>

    <form id="rating-form">
        <div class="form-group gender-group">
            <label for="gender">Пол:</label>
            <select id="gender" name="Пол">
                <option value="men">Мужчины</option>
                <option value="women">Женщины</option>
            </select>
        </div>
        <div class="form-group">
            <label for="ImperialIndoorTriathlon">Империал Индор Триатлон:</label>
            <input type="number" id="ImperialIndoorTriathlon" name="Империал Индор Триатлон" min="0" max="700">
        </div>
        <div class="form-group">
            <label for="LogoiskWinterTri">Зимний триатлон. Логойск:</label>
            <input type="number" id="LogoiskWinterTri" name="Зимний триатлон. Логойск" min="0" max="700">
        </div>
        <div class="form-group">
            <label for="LogoiskWinterDuo">Зимний дуатлон. Логойск:</label>
            <input type="number" id="LogoiskWinterDuo" name="Зимний дуатлон. Логойск" min="0" max="700">
        </div>
        <div class="form-group">
            <label for="MinskIndoorTriathlon">Индор триатлон. Минск:</label>
            <input type="number" id="MinskIndoorTriathlon" name="Индор триатлон. Минск" min="0" max="700">
        </div>
        <div class="form-group">
            <label for="DuathlonDrogichin">Дуатлон. Дрогичин:</label>
            <input type="number" id="DuathlonDrogichin" name="Дуатлон. Дрогичин" min="0" max="700">
        </div>
        <div class="form-group">
            <label for="TriathlonMogiLev">Спринт. МогиЛев:</label>
            <input type="number" id="TriathlonMogiLev" name="Спринт. МогиЛев" min="0" max="700">
        </div>
        <div class="form-group">
            <label for="BrestOlympic">Олимпийка. Брест:</label>
            <input type="number" id="BrestOlympic" name="Олимпийка. Брест" min="0" max="800">
        </div>
        <div class="form-group">
            <label for="KrossTriathlonGanna">Кросс-триатлон. У Ганны:</label>
            <input type="number" id="KrossTriathlonGanna" name="Кросс-триатлон. У Ганны" min="0" max="700">
        </div>
        <div class="form-group">
            <label for="KubokPolesiaGomel">Спринт. Гомель:</label>
            <input type="number" id="KubokPolesiaGomel" name="Спринт. Гомель" min="0" max="700">
        </div>
        <div class="form-group">
            <label for="SvyatskSprint">Спринт. Святск:</label>
            <input type="number" id="SvyatskSprint" name="Спринт. Святск" min="0" max="700">
        </div>
        <div class="form-group">
            <label for="MinskTriathlonIronmen">Минский триатлон. Полная:</label>
            <input type="number" id="MinskTriathlonIronmen" name="Минский триатлон. Полная" min="0" max="1000">
        </div>
        <div class="form-group">
            <label for="MinskTriathlonHalfIronmen">Минский триатлон. Половинка:</label>
            <input type="number" id="MinskTriathlonHalfIronmen" name="Минский триатлон. Половинка" min="0" max="900">
        </div>
        <div class="form-group">
            <label for="MinskTriathlonOlympic">Минский триатлон. Олимпийка:</label>
            <input type="number" id="MinskTriathlonOlympic" name="Минский триатлон. Олимпийка" min="0" max="800">
        </div>
        <div class="form-group">
            <label for="MinskTriathlonSprint">Минский триатлон. Спринт:</label>
            <input type="number" id="MinskTriathlonSprint" name="Минский триатлон. Спринт" min="0" max="700">
        </div>
        <div class="form-group">
            <label for="KubokPolesiaKrossGomel">Кросс-триатлон. Гомель:</label>
            <input type="number" id="KubokPolesiaKrossGomel" name="Кросс-триатлон. Гомель" min="0" max="700">
        </div>
        <div class="form-group">
            <label for="KubokPolesiaKrossDuoGomel">Кросс-дуатлон. Гомель:</label>
            <input type="number" id="KubokPolesiaKrossDuoGomel" name="Кросс-дуатлон. Гомель" min="0" max="700">
        </div>
        <div class="form-group">
            <label for="SoligorskAquathlon">Акватлон. Солигорск:</label>
            <input type="number" id="SoligorskAquathlon" name="Акватлон. Солигорск" min="0" max="700">
        </div>
        <div class="form-group">
            <label for="KrossTriathlonBraslav">Кросс-триатлон. Браслав:</label>
            <input type="number" id="KrossTriathlonBraslav" name="Кросс-триатлон. Браслав" min="0" max="700">
        </div>
        <div class="form-group">
            <label for="DuathlonRaubichi">Дуатлон. Раубичи</label>
            <input type="number" id="DuathlonRaubichi" name="Дуатлон. Раубичи" min="0" max="800">
        </div>
        <div class="form-group result-group">
            <output id="total-points" style="padding: 0;">
                <div class="breakdown-section">
                    <div class="breakdown-title">Лучшие по категориям</div>
                    <div class="chip-row" id="priority-chips"></div>
                </div>
                <div class="breakdown-section" id="other-section">
                    <div class="breakdown-title" id="other-title"></div>
                    <div class="chip-row" id="other-chips"></div>
                </div>
                <div class="calc-total">Сумма: <span id="total-value"></span></div>
            </output>
        </div>
    </form>

    <script>
        // Function to get query parameters from the URL
        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            const queryParams = {};
            params.forEach((value, key) => {
                const parsedValue = parseFloat(value);
                if (!isNaN(parsedValue)) {
                    queryParams[key] = parsedValue;
                }
            });
            return queryParams;
        }

        const events = {
            'ImperialIndoorTriathlon': 'Multi',
            'LogoiskWinterTri': 'Multi',
            'LogoiskWinterDuo': 'Duathlon',
            'MinskIndoorTriathlon': 'Multi',
            'DuathlonDrogichin': 'Duathlon',
            'TriathlonMogiLev': 'Sprint',
            'BrestOlympic': 'Stayer',
            'KrossTriathlonGanna': 'Multi',
            'KubokPolesiaGomel': 'Sprint',
            'SvyatskSprint': 'Sprint',
            'MinskTriathlonIronmen': 'Stayer',
            'MinskTriathlonHalfIronmen': 'Stayer',
            'MinskTriathlonOlympic': 'Stayer',
            'MinskTriathlonSprint': 'Sprint',
            'KubokPolesiaKrossGomel': 'Multi',
            'KubokPolesiaKrossDuoGomel': 'Multi',
            'SoligorskAquathlon': 'Multi',
            'KrossTriathlonBraslav': 'Multi',
            'DuathlonRaubichi': 'Duathlon'
        };

        const queryParams = getQueryParams();
        const rawQueryParams = new URLSearchParams(window.location.search);
        const genderElement = document.getElementById('gender');
        genderElement.value = rawQueryParams.get('gender') === 'women' ? 'women' : 'men';
        genderElement.addEventListener('change', () => {
            const params = new URLSearchParams(window.location.search);
            params.set('gender', genderElement.value);
            const newUrl = `${window.location.pathname}?${params.toString()}`;
            window.history.replaceState({}, '', newUrl);
            calculateTotalPoints();
        });

        Object.keys(events).forEach(event => {
            const inputElement = document.getElementById(event);
            if (inputElement) {
                // Populate initial values from URL query params
                if (queryParams[event] !== undefined) {
                    inputElement.value = queryParams[event];
                }

                // Update URL query params when input values change
                inputElement.addEventListener('input', () => {
                    const params = new URLSearchParams(window.location.search);
                    params.set(event, inputElement.value);
                    const newUrl = `${window.location.pathname}?${params.toString()}`;
                    window.history.replaceState({}, '', newUrl);
                });

                // Calculate total points on input change
                inputElement.addEventListener('input', () => {
                    calculateTotalPoints();
                });
            }
        });

        const prioritisedCategories = ['Sprint', 'Stayer', 'Duathlon', 'Multi'];
        const categoryClass = {
            Sprint: 'cat-sprint',
            Stayer: 'cat-stayer',
            Duathlon: 'cat-duathlon',
            Multi: 'cat-multi'
        };
        const categoryLabel = {
            Sprint: 'Спринт',
            Stayer: 'Стайер',
            Duathlon: 'Дуатлон',
            Multi: 'Мульти'
        };

        // mark each event's own input with a dot matching its category, using
        // the same palette as the rating page's per-athlete breakdown
        Object.keys(events).forEach(event => {
            const label = document.querySelector(`label[for="${event}"]`);
            if (!label) return;
            const dot = document.createElement('span');
            dot.className = `cat-badge ${categoryClass[events[event]]}`;
            label.prepend(dot);
        });

        function calculatePrioritisedCategoryMax(events) {
            const categoryMax = {};

            Object.keys(events).forEach(event => {
                const category = events[event];
                const value = parseFloat(document.getElementById(event).value);

                if (prioritisedCategories.includes(category) && !isNaN(value)) {
                    if (categoryMax[category] === undefined || value > categoryMax[category].value) {
                        categoryMax[category] = { event, value };
                    }
                }
            });

            return categoryMax;
        }

        function calculateTotalPoints() {
            const prioritisedCategoriesMax = calculatePrioritisedCategoryMax(events);
            console.log('Maximum points for prioritised categories:', prioritisedCategoriesMax);

            let totalPoints = 0;

            const eventValues = Object.keys(events).reduce((acc, event) => {
                const inputElement = document.getElementById(event);
                if (inputElement && inputElement.value !== undefined) {
                    const value = parseFloat(inputElement.value);
                    if (!isNaN(value)) {
                        acc[event] = value;
                    }
                }
                return acc;
            }, {});

            console.log('Event values:', eventValues);

            const otherEventValues = Object.keys(eventValues).reduce((acc, event) => {
                const category = events[event];
                if (!prioritisedCategoriesMax[category] || prioritisedCategoriesMax[category].event !== event) {
                    acc[event] = eventValues[event];
                }
                return acc;
            }, {});

            console.log('Other event values:', otherEventValues);
            const otherCount = genderElement.value === 'women' ? 1 : 3;
            const topOtherEventValues = Object.entries(otherEventValues)
                .sort(([, a], [, b]) => b - a) // Sort by value descending
                .slice(0, otherCount)
                .reduce((acc, [event, value]) => {
                    acc[event] = value;
                    return acc;
                }, {});

            console.log(`Top ${otherCount} other event values:`, topOtherEventValues);

            function getEventName(event) {
                return document.getElementById(event).name;
            }

            function chipHtml(catClass, name, value, extraClass) {
                return `<span class="chip ${extraClass || ''}">` +
                    `<span class="cat-badge ${catClass}"></span>` +
                    `<span class="chip-name">${name}</span>` +
                    `<span class="chip-points">${value}</span>` +
                    `</span>`;
            }

            document.getElementById('priority-chips').innerHTML = prioritisedCategories
                .map(category => {
                    const best = prioritisedCategoriesMax[category];
                    const catClass = categoryClass[category];
                    return best
                        ? chipHtml(catClass, getEventName(best.event), best.value)
                        : chipHtml(catClass, categoryLabel[category], 'не участвовал', 'chip-empty');
                })
                .join('');

            document.getElementById('other-title').textContent =
                `Лучшие остальные (${Object.keys(topOtherEventValues).length})`;
            document.getElementById('other-section').style.display =
                Object.keys(topOtherEventValues).length > 0 ? '' : 'none';
            document.getElementById('other-chips').innerHTML = Object.entries(topOtherEventValues)
                .map(([event, value]) => chipHtml(categoryClass[events[event]], getEventName(event), value))
                .join('');

            const result = Object.values(prioritisedCategoriesMax).reduce((sum, item) => sum + (item ? item.value : 0), 0) + Object.values(topOtherEventValues).reduce((sum, value) => sum + value, 0)
            document.getElementById('total-value').textContent = result.toFixed(2);

            return result;
        }

        // Run calculateTotalPoints on page load
        window.addEventListener('DOMContentLoaded', () => {
            const totalPoints = calculateTotalPoints();

            // Compare scalaTotalPoints query param with calculated result
            const scalaTotalPoints = parseFloat(queryParams['scalaTotalValue']);
            console.log('Scala total points from query:', scalaTotalPoints);
            if (!isNaN(scalaTotalPoints)) {
                const roundedResult = Math.round(totalPoints * 100) / 100; // Round to 2 decimal digits
                if (roundedResult !== scalaTotalPoints) {
                    alert(`Что-то пошло не так! Результат калькулятора: ${roundedResult} не соответсвует очкам в рейтинге: ${scalaTotalPoints}, пожалуйста, обратитесь в телеграм @mkharytonau.`);
                }
            }
        });
    </script>

</body>

</html>
